version: "3.8"
services:
  comfy:
    image: thanhlam00290/comfyui
    container_name: comfyui
    ports:
      - "8188:8188"
    volumes:
      - ./model:/app/ComfyUI/models:rw
      - ./output:/app/ComfyUI/output:rw
    environment:
      - HF_AUTO_DOWNLOAD=1
      - HF_TOKEN=${HF_TOKEN:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sSf http://localhost:8188/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel --no-autoupdate --url http://comfy:8188
    
    restart: unless-stopped
    depends_on:
      - comfy
