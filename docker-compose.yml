version: "3.8"
services:
  comfyui:
    image: thanhlam00290/comfyui
    container_name: comfyui
    ports:
      - "8188:8188"
    volumes:
      - ./input:/app/ComfyUI/input:rw
      - ./output:/app/ComfyUI/output:rw
      - ./custom_nodes:/app/ComfyUI/custom_nodes:rw
      - ./models:/app/ComfyUI/models:rw
    environment:
      - HF_AUTO_DOWNLOAD=1
      - HF_TOKEN=${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel --no-autoupdate --url http://comfy:8188
    
    restart: unless-stopped
    depends_on:
      - comfy
