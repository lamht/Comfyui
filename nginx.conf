worker_processes auto; # Tự động nhận diện số core CPU thay vì fix cứng bằng 3
worker_rlimit_nofile 100000;

events {
    worker_connections 16384;
    multi_accept on;
}

http {
    include      mime.types;
    default_type  application/octet-stream;

    # ===== TCP tối ưu =====
    sendfile on;
    sendfile_max_chunk 512k;
    tcp_nopush on;
    tcp_nodelay on;
    aio threads;

    keepalive_timeout 15;
    keepalive_requests 10000;

    types_hash_max_size 2048;

    # ===== Upload =====
    client_max_body_size 500M;
    client_body_buffer_size 512k;
    client_body_timeout 300s;
    client_body_in_single_buffer off;
    client_body_temp_path /dev/shm/nginx_temp 1 2;

    # ===== Gzip =====
    gzip on;
    # Bổ sung text/html và image/svg+xml vào gzip
    gzip_types text/plain application/json text/css application/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_vary on;

    # ===== Log =====
    access_log /var/log/nginx/access.log combined buffer=32k flush=5s;

    # ===== WebSocket fix =====
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # ===== Upstream =====
    upstream comfy_backend {
        server 127.0.0.1:8188;
        keepalive 64;
    }

    # ==============================
    # SERVER COMFYUI
    # ==============================
    server {
        listen 9999;
        server_name _;

        # ===== Timeout cho AI job =====
        proxy_read_timeout 600s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;

        # Block dùng chung cho các proxy setting (Tránh lặp lại code)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        location / {
            proxy_pass http://comfy_backend;

            # ===== Upload/Download streaming =====
            proxy_request_buffering off;
            proxy_buffering off;          # Tắt bộ đệm để phản hồi tức thì
            proxy_max_temp_file_size 0;   # Không cho phép ghi file tạm xuống ổ cứng
        }

        # ===== Cache & Tối ưu hóa phản hồi Image/Mask =====
        location ~* \.(?:jpg|jpeg|png|gif|webp|svg|ico|bmp|tiff)$ {
            proxy_pass http://comfy_backend;
            
            proxy_request_buffering off;
            
            # SỬA LỖI SLOW MASK TẠI ĐÂY:
            # Vẫn bật buffering để tận dụng cache trình duyệt, nhưng:
            proxy_buffering on;
            proxy_max_temp_file_size 0;   # TUYỆT ĐỐI KHÔNG ghi đĩa file tạm nếu ảnh lớn.
            
            # Tăng buffer size để chứa vừa các file mask/ảnh PNG dung lượng lớn trong RAM
            proxy_buffer_size 512k;
            proxy_buffers 16 512k;
            proxy_busy_buffers_size 512k;

            # Cache header
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }
    }
}